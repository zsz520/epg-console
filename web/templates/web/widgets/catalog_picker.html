<div class="catalog-picker" data-xmltv-feeds="{{ xmltv_feeds_json }}" data-preview-date="{{ preview_date }}" data-field="{{ widget.name }}" data-preview-timeout="{{ preview_timeout }}" data-channel-pk="{{ channel_pk }}" data-preview-url="{% url 'admin:source-preview' %}" data-original-mapping="{{ original_mapping }}" data-search-url="{% url 'admin:catalog-search' %}"><div class="picker-toolbar"><input class="catalog-query" type="search" value="{{ search_name }}" placeholder="输入来源网站上的频道名称" aria-label="搜索来源频道"><select class="catalog-source" aria-label="筛选来源"><option value="">全部来源</option>{% for key,label in sources %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select><button class="catalog-search secondary" type="button">查找</button></div><div class="catalog-selected">{% for row in selected %}<span class="catalog-chip" data-name="{{ row.out_name }}" data-id="{{ row.pk }}" data-source="{{ row.source }}" data-identifier="{{ row.out_channel_id }}"><input type="hidden" name="{{ widget.name }}" value="{{ row.pk }}">{{ row.out_name }} · {{ row.source }}<button type="button" aria-label="移除此选择">×</button></span>{% endfor %}</div><div class="catalog-notice" role="status" aria-live="polite"></div><div class="catalog-results" aria-live="polite"></div><div class="custom-preview-toolbar"><label>自定义来源 <select class="custom-source" aria-label="自定义来源"><option value="">请选择来源</option>{% for key,label in sources %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>频道 ID <input type="text" class="custom-id" aria-label="自定义频道 ID" maxlength="285" placeholder="输入来源网站的频道 ID"></label><button type="button" class="secondary custom-preview">预览自定义 ID 节目</button><small>用于目录中未列出的频道；预览后可选择使用，保存频道才生效。</small></div><section class="source-comparison"><div class="comparison-heading"><strong>节目对比</strong><div class="preview-date-toolbar"><button type="button" class="secondary preview-day-prev" aria-label="预览前一天">← 前一天</button><input type="date" class="preview-date" aria-label="节目对比日期" value="{{ preview_date }}" min="{{ preview_min }}" max="{{ preview_max }}"><button type="button" class="secondary preview-day-today">今天</button><button type="button" class="secondary preview-day-next" aria-label="预览后一天">后一天 →</button></div><button type="button" class="secondary compare-selected">对比已配置来源</button></div><p class="hint">选择来源或点击搜索结果的“节目预览”可实时预览，不写入节目库。可选今天前后 7 天；显示所选日期节目，成功预览缓存 {{ preview_cache_seconds }} 秒，可重新抓取。</p><div class="comparison-notice" role="status"></div><div class="source-preview-cards" aria-live="polite"></div></section></div>
