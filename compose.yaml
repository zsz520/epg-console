name: epg-console
services:
  web:
    image: zsz520/epg-console:2.12
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd57:6570:6720::/64"
